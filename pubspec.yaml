name: metawekiya_ocr_app
description: "A Flutter app to scan ID cards using camera OCR and export data to Excel."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.10.5+9
  google_mlkit_text_recognition: ^0.11.0
  excel: ^4.0.3
  path_provider: ^2.1.2
  permission_handler: ^11.3.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
